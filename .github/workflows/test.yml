name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Pinned so a new stable release's lints can't break CI; bump deliberately.
  RUST_TOOLCHAIN: "1.99.0"
  BUN_VERSION: "1.3.9"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  MATURIN_VERSION: "1.15.0"
  PYTEST_VERSION: "9.1.1"
  CARGO_AUDIT_VERSION: "0.22.2"

# Third-party actions are pinned to commit SHAs; the trailing comment names the release.
jobs:
  rust-test:
    name: Rust tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no default features
            key: no-default-features
            args: --no-default-features
          - name: default features
            key: default-features
            args: ""
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # rust-cache keys on Cargo.lock, Cargo.toml and the toolchain.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ray-rs
          key: ${{ matrix.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test ${{ matrix.args }}

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ray-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lints the lib, its unit tests and the integration tests; any finding fails.
      - name: cargo clippy (no default features)
        run: cargo clippy --lib --tests --no-default-features -- -D warnings
      - name: cargo clippy (default features)
        run: cargo clippy --lib --tests -- -D warnings

  rust-fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      # Fails on any RustSec vulnerability in Cargo.lock (warnings such as "unmaintained" don't
      # fail). To accept an advisory, list it with a reason under [advisories] ignore in
      # ray-rs/.cargo/audit.toml.
      - name: cargo audit
        run: cargo audit

  napi-build:
    name: Node binding (debug build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ray-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Not --frozen-lockfile: each release bumps ray-rs's optionalDependencies on its own
      # platform packages, which the workspace bun.lock records.
      - name: Install dependencies
        run: bun install
      - name: Build native binding and TypeScript wrapper
        run: bun run build:debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-binding
          path: |
            ray-rs/core.*.node
            ray-rs/dist/
          if-no-files-found: error
          retention-days: 1

  node-test:
    name: Node tests (ava)
    needs: napi-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-binding
          path: ray-rs
      - name: ava
        run: bun run test

  bun-test:
    name: Bun tests (playground, tui)
    needs: napi-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Before the tui install: tui depends on file:../ray-rs, which bun copies, binding included.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-binding
          path: ray-rs
      - name: Install playground dependencies
        working-directory: playground
        run: bun install --frozen-lockfile
      - name: Test playground
        working-directory: playground
        run: bun test
      - name: Install tui dependencies
        working-directory: tui
        run: bun install --frozen-lockfile
      - name: Test tui
        working-directory: tui
        run: bun test

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ray-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ray-rs/pyproject.toml
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ray-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install build and test tools
        run: pip install "maturin==${MATURIN_VERSION}" "pytest==${PYTEST_VERSION}"
      - name: Build extension (maturin develop)
        run: maturin develop
      - name: pytest
        run: pytest python/tests
