name: Build Documentation

# Builds and tests the docs site. Deployment is done by Vercel's GitHub integration
# (project root: ray-docs, settings in ray-docs/vercel.json), not by this workflow.

on:
  push:
    branches: [main, ray-rs]
    paths:
      - "ray-docs/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "ray-docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.3.9"
  NODE_VERSION: "22"

# Third-party actions are pinned to commit SHAs; the trailing comment names the release.
jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ray-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # vite runs on node (its bin's shebang), as on Vercel.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Same install and build commands as ray-docs/vercel.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run build
      # The tests fetch every page from a running server (see ray-docs/tests).
      - name: Test docs against the built server
        env:
          PORT: "5311"
          DOCS_URL: http://localhost:5311
        run: |
          node .output/server/index.mjs > "$RUNNER_TEMP/docs-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$DOCS_URL/" && break
            sleep 1
          done
          bun run test || { cat "$RUNNER_TEMP/docs-server.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: ray-docs/.output
          # upload-artifact skips dot-paths by default, and .output is one.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
