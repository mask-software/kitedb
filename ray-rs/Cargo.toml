[package]
name = "kitedb"
version = "0.2.18"
edition = "2021"
authors = ["KiteDB Contributors"]
description = "High-performance embedded graph database"
license = "MIT"
readme = "CRATE_README.md"
documentation = "https://docs.rs/kitedb"
homepage = "https://github.com/mask-software/kitedb"
repository = "https://github.com/mask-software/kitedb"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# NAPI bindings (optional)
napi = { version = "3.0.0", features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "3.0.0", optional = true }

# PyO3 bindings (optional)
pyo3 = { version = "0.29.3", features = ["extension-module"], optional = true }

# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Binary encoding
byteorder = "1.5"

# Hash functions
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Compression
flate2 = "1.1"

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Collections
hashbrown = "0.15"
indexmap = "2.9"

# Ordered floats for heap operations
ordered-float = "5.0"

# Bitflags for snapshot flags
bitflags = "2.9"


# Random number generation (for k-means)
rand = "0.8"

# Unix-specific APIs (for directory sync)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Memory mapping (native only)
memmap2 = "0.9.11" # >= 0.9.11: RUSTSEC-2026-0186
# File locking (native only)
fs2 = "0.4"
# Parallelism (native only)
rayon = "1.10"
# Compression (native only)
zstd = "0.13"
# OTLP metrics push (optional, `otlp` feature; native only: these need sockets,
# which wasm32 doesn't have, so `otlp` adds nothing to a wasm32 build)
ureq = { version = "2.10", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
webpki-roots = { version = "1.0", optional = true }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "metrics"], optional = true }
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots", "gzip"], optional = true }
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "fs", "sync", "time", "net"], optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3.20"
# examples/ray_vs_memgraph_bench.rs drives neo4rs from a runtime of its own
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "time", "net"] }
criterion = "0.5"
neo4rs = "0.8"

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "single_file"
harness = false

[[bench]]
name = "concurrent"
harness = false

[[bench]]
name = "write_path"
harness = false

# `cargo test` runs this example's unit tests (its batch sizing).
[[example]]
name = "single_file_raw_bench"
test = true

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build", "otlp"]
python = ["dep:pyo3", "otlp"]
# Push replication metrics to an OpenTelemetry collector (HTTP and gRPC).
# The bindings enable it; Rust users opt in. No effect on wasm32 targets.
otlp = [
  "dep:ureq",
  "dep:rustls-pemfile",
  "dep:webpki-roots",
  "dep:opentelemetry-proto",
  "dep:prost",
  "dep:tonic",
  "dep:tokio",
]
async = []
bench-profile = []

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1

[profile.dev]
opt-level = 1
